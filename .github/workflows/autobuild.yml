name: Autobuild

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: autobuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node with cache: pnpm invokes pnpm; it must exist before this step
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Create .env from example
        run: node -e "require('fs').copyFileSync('.env.example', '.env')"

      - name: Install dependencies
        run: pnpm install

      - name: Debug build environment
        run: |
          node -e "console.log('DBG_H1 node', process.version); console.log('DBG_H1 openssl', process.versions.openssl); console.log('DBG_H2 NODE_OPTIONS', process.env.NODE_OPTIONS || '(empty)')"

      - name: Debug MD4 hash support
        run: |
          node -e "const c=require('crypto'); try { c.createHash('md4').update('x').digest('hex'); console.log('DBG_H1 md4 supported'); } catch (e) { console.log('DBG_H1 md4 unsupported', e.message); }"

      - name: Build app (webpack)
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: pnpm run build

      # package.json extraFiles points at placeholder path; real releases use _build_.py
      - name: Ensure updater path exists for electron-builder
        shell: bash
        run: mkdir -p path_to_updater && touch path_to_updater/.gitkeep

      - name: Package app (Windows installer + portable)
        if: runner.os == 'Windows'
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm exec electron-builder --win --x64 --publish never --config.npmRebuild=false

      - name: Package app (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm exec electron-builder --linux AppImage --x64 --publish never --config.npmRebuild=false

      - name: Package app (macOS dmg)
        if: runner.os == 'macOS'
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm exec electron-builder --mac dmg --publish never --config.npmRebuild=false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anilibrix-${{ matrix.os }}-${{ github.sha }}
          if-no-files-found: warn
          path: release/**
