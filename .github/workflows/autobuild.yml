name: Autobuild

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: autobuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-13]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack and Yarn 3.6.1
        run: |
          corepack enable
          corepack prepare yarn@3.6.1 --activate
          yarn --version

      - name: Create .env from example
        run: node -e "require('fs').copyFileSync('.env.example', '.env')"

      - name: Install dependencies
        run: yarn install

      - name: Debug build environment
        run: |
          node -e "console.log('DBG_H1 node', process.version); console.log('DBG_H1 openssl', process.versions.openssl); console.log('DBG_H2 NODE_OPTIONS', process.env.NODE_OPTIONS || '(empty)')"

      - name: Debug MD4 hash support
        run: |
          node -e "const c=require('crypto'); try { c.createHash('md4').update('x').digest('hex'); console.log('DBG_H1 md4 supported'); } catch (e) { console.log('DBG_H1 md4 unsupported', e.message); }"

      - name: Build app
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anilibrix-${{ matrix.os }}-${{ github.sha }}
          if-no-files-found: warn
          path: |
            dist/electron/**
            release/**
            out/**
